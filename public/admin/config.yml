local_backend: true

media_folder: 'public/images/uploads'
public_folder: '/images/uploads'

# One sidebar entry per website section, in the order they appear on the site; shop and settings last.
collections:
  - name: hero
    label: 'Hero'
    description: 'The big video section at the top of the home page: headline, intro and button.'
    files:
      - file: 'content/home/home.md'
        label: 'Hero'
        name: 'home'
        fields:
          - { label: 'Eyebrow (English)', name: 'eyebrow_en', widget: 'string' }
          - { label: 'Eyebrow (Serbian)', name: 'eyebrow_sr', widget: 'string', required: false }
          - { label: 'Eyebrow (Russian)', name: 'eyebrow_ru', widget: 'string', required: false }
          - { label: 'Headline (English)', name: 'headline_en', widget: 'string' }
          - { label: 'Headline (Serbian)', name: 'headline_sr', widget: 'string', required: false }
          - { label: 'Headline (Russian)', name: 'headline_ru', widget: 'string', required: false }
          - { label: 'Subheadline (English)', name: 'subheadline_en', widget: 'text' }
          - { label: 'Subheadline (Serbian)', name: 'subheadline_sr', widget: 'text', required: false }
          - { label: 'Subheadline (Russian)', name: 'subheadline_ru', widget: 'text', required: false }
          - { label: 'Button Text (English)', name: 'cta_label_en', widget: 'string' }
          - { label: 'Button Text (Serbian)', name: 'cta_label_sr', widget: 'string', required: false }
          - { label: 'Button Text (Russian)', name: 'cta_label_ru', widget: 'string', required: false }
          - { label: 'Button Link', name: 'cta_link', widget: 'string', default: '#contact' }
          - name: hero_video
            label: Hero video
            widget: file
            required: false
            choose_url: false
            media_folder: '/public/assets/videos'
            public_folder: '/assets/videos'
            hint: 'MP4, no sound, about 10-15 seconds, ideally under 3 MB so the page loads fast. Leave empty to use the default video.'
          - name: hero_poster
            label: Hero poster image (shown while the video loads)
            widget: image
            required: false
            hint: 'A still frame from the video. Makes the page feel instant on slow connections.'
          - name: hero_overlay
            label: Darkness over the video (0 = none, 100 = black)
            widget: number
            value_type: int
            min: 0
            max: 100
            default: 60
            required: false
          - name: hero_grayscale
            label: Black and white amount (0 = full color, 100 = fully gray)
            widget: number
            value_type: int
            min: 0
            max: 100
            default: 100
            required: false

  - name: 'gallery'
    label: 'Gallery photos'
    label_singular: 'Gallery photo'
    description: 'Your tattoo photos. Turn on "Featured on homepage" to also show one on the home page (up to 10).'
    folder: 'content/gallery'
    create: true
    slug: '{{slug}}'
    identifier_field: title_en
    summary: '{{title_en}}'
    fields:
      - { label: 'Title (English)', name: 'title_en', widget: 'string', hint: 'Short and descriptive, e.g. "Koi sleeve"' }
      - { label: 'Title (Serbian)', name: 'title_sr', widget: 'string', required: false }
      - { label: 'Title (Russian)', name: 'title_ru', widget: 'string', required: false }
      - { label: 'Image', name: 'image', widget: 'image' }
      - { label: 'Image description (English)', name: 'image_alt_en', widget: 'string', required: false, hint: 'Helps Google Images find your work. Describe it, e.g. "Japanese koi sleeve, black and grey, forearm". Leave empty to use the title.' }
      - { label: 'Image description (Serbian)', name: 'image_alt_sr', widget: 'string', required: false }
      - { label: 'Image description (Russian)', name: 'image_alt_ru', widget: 'string', required: false }
      - label: Categories
        name: category
        widget: relation
        collection: categories
        search_fields: [name_en]
        value_field: '{{slug}}'
        display_fields: [name_en]
        multiple: true
      - { label: 'Featured on homepage', name: 'featured', widget: 'boolean', default: false }
      - { label: 'Order', name: 'order', widget: 'number', value_type: int, required: false, hint: 'Lower numbers show first. Leave empty to put it at the end.' }

  - name: categories
    label: 'Gallery categories'
    label_singular: Category
    description: 'The filter buttons on the Gallery page, e.g. Japanese, Black & Grey.'
    folder: content/categories
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    identifier_field: name_en
    summary: '{{name_en}}'
    fields:
      - { label: Name (EN), name: name_en, widget: string }
      - { label: Name (SR), name: name_sr, widget: string, required: false }
      - { label: Name (RU), name: name_ru, widget: string, required: false }
      - { label: Order, name: order, widget: number, value_type: int, required: false }

  - name: gallery_texts
    label: 'Gallery texts'
    description: 'Headings and buttons for the gallery on the home page and the Gallery page.'
    files:
      - name: gallery_page
        label: 'Gallery texts'
        file: content/gallery-page/gallery-page.md
        fields:
          - { name: gallery_heading_en, label: Homepage gallery heading (EN), widget: string }
          - { name: gallery_heading_sr, label: Homepage gallery heading (SR), widget: string, required: false }
          - { name: gallery_heading_ru, label: Homepage gallery heading (RU), widget: string, required: false }
          - { name: gallery_cta_en, label: "'View all' button text (EN)", widget: string }
          - { name: gallery_cta_sr, label: "'View all' button text (SR)", widget: string, required: false }
          - { name: gallery_cta_ru, label: "'View all' button text (RU)", widget: string, required: false }
          - { name: page_title_en, label: Gallery page title (EN), widget: string }
          - { name: page_title_sr, label: Gallery page title (SR), widget: string, required: false }
          - { name: page_title_ru, label: Gallery page title (RU), widget: string, required: false }
          - { name: page_intro_en, label: Gallery page intro (EN), widget: text }
          - { name: page_intro_sr, label: Gallery page intro (SR), widget: text, required: false }
          - { name: page_intro_ru, label: Gallery page intro (RU), widget: text, required: false }
          - name: favorite
            label: Favorite piece (shown large at the top of the Gallery page)
            widget: relation
            collection: gallery
            search_fields: [title_en]
            value_field: '{{slug}}'
            display_fields: [title_en]
            required: false

  - name: about
    label: 'About'
    description: 'The "About me" section: your photo, text and the "What I do" cards.'
    files:
      - name: about
        label: 'About'
        file: content/about/about.md
        fields:
          - { name: image, label: Photo, widget: image }
          - { name: image_alt_en, label: Photo description (EN), widget: string }
          - { name: image_alt_sr, label: Photo description (SR), widget: string, required: false }
          - { name: image_alt_ru, label: Photo description (RU), widget: string, required: false }
          - { name: title_en, label: Title (EN), widget: string }
          - { name: title_sr, label: Title (SR), widget: string, required: false }
          - { name: title_ru, label: Title (RU), widget: string, required: false }
          - name: body_en
            label: Text (EN)
            widget: markdown
            modes: [rich_text]
            buttons: [bold, italic, link, heading-two, heading-three, quote, bulleted-list, numbered-list]
            editor_components: [image]
          - name: body_sr
            label: Text (SR)
            widget: markdown
            required: false
            modes: [rich_text]
            buttons: [bold, italic, link, heading-two, heading-three, quote, bulleted-list, numbered-list]
            editor_components: [image]
          - name: body_ru
            label: Text (RU)
            widget: markdown
            required: false
            modes: [rich_text]
            buttons: [bold, italic, link, heading-two, heading-three, quote, bulleted-list, numbered-list]
            editor_components: [image]
          - name: specialties
            label: What I do
            label_singular: Specialty
            widget: list
            summary: '{{fields.title_en}}'
            fields:
              - { name: title_en, label: Name (EN), widget: string, hint: 'Short, e.g. "Japanese style"' }
              - { name: title_sr, label: Name (SR), widget: string, required: false }
              - { name: title_ru, label: Name (RU), widget: string, required: false }
              - { name: text_en, label: Description (EN), widget: text }
              - { name: text_sr, label: Description (SR), widget: text, required: false }
              - { name: text_ru, label: Description (RU), widget: text, required: false }

  - name: 'testimonials'
    label: 'Reviews'
    label_singular: 'Testimonial'
    description: 'Client reviews. The newest show first on the home page.'
    folder: 'content/testimonials'
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{client_name}}'
    identifier_field: client_name
    summary: '{{client_name}} ({{source}}), {{date}}'
    sortable_fields: ['date', 'client_name']
    fields:
      - { label: 'Client Name', name: 'client_name', widget: 'string', hint: 'First name, or first name and last initial, e.g. "Ana M."' }
      - { label: 'Date', name: 'date', widget: 'datetime', date_format: 'YYYY-MM-DD', time_format: false, picker_utc: true }
      - { label: 'Rating (1-5)', name: 'rating', widget: 'number', min: 1, max: 5, default: 5 }
      - { label: 'Source', name: 'source', widget: 'string', hint: 'e.g. iNKPPL, Google, Instagram' }
      - label: 'Original language'
        name: 'original_language'
        widget: 'select'
        options:
          - { label: 'English', value: 'en' }
          - { label: 'Serbian', value: 'sr' }
          - { label: 'Russian', value: 'ru' }
        default: 'en'
      - { label: 'Quote (original text)', name: 'quote', widget: 'text' }
      - { label: 'Translation to English (optional, leave empty if the original is English)', name: 'quote_en', widget: 'text', required: false }
      - { label: 'Translation to Serbian (optional, leave empty if the original is Serbian)', name: 'quote_sr', widget: 'text', required: false }
      - { label: 'Translation to Russian (optional, leave empty if the original is Russian)', name: 'quote_ru', widget: 'text', required: false }

  - name: reviews_heading
    label: 'Reviews heading'
    description: 'The heading above the reviews.'
    files:
      - name: testimonials_section
        label: 'Reviews heading'
        file: content/testimonials-section/testimonials-section.md
        fields:
          - { name: title_en, label: Heading (EN), widget: string }
          - { name: title_sr, label: Heading (SR), widget: string, required: false }
          - { name: title_ru, label: Heading (RU), widget: string, required: false }

  - name: booking
    label: 'How booking works'
    description: 'The numbered booking steps, with optional photos.'
    files:
      - name: booking
        label: 'How booking works'
        file: content/booking/booking.md
        fields:
          - { name: title_en, label: Section title (EN), widget: string }
          - { name: title_sr, label: Section title (SR), widget: string, required: false }
          - { name: title_ru, label: Section title (RU), widget: string, required: false }
          - name: steps
            label: Steps
            label_singular: Step
            widget: list
            summary: '{{fields.title_en}}'
            fields:
              - { name: title_en, label: Title (EN), widget: string }
              - { name: title_sr, label: Title (SR), widget: string, required: false }
              - { name: title_ru, label: Title (RU), widget: string, required: false }
              - { name: text_en, label: Text (EN), widget: text }
              - { name: text_sr, label: Text (SR), widget: text, required: false }
              - { name: text_ru, label: Text (RU), widget: text, required: false }
              - name: image
                label: Image (optional)
                widget: image
                required: false
                hint: 'Shown beside the steps on desktop and swaps as visitors scroll. Portrait photo (4:5) works best. Leave every step empty to hide the picture column.'
              - { name: image_alt_en, label: Image description (EN), widget: string, required: false, hint: 'Short description for Google and screen readers, e.g. "Pencil sketch of a koi sleeve"' }
              - { name: image_alt_sr, label: Image description (SR), widget: string, required: false }
              - { name: image_alt_ru, label: Image description (RU), widget: string, required: false }

  - name: faq
    label: 'FAQ'
    description: 'Frequently asked questions.'
    files:
      - name: faq
        label: 'FAQ'
        file: content/faq/faq.md
        fields:
          - { name: title_en, label: Section title (EN), widget: string }
          - { name: title_sr, label: Section title (SR), widget: string, required: false }
          - { name: title_ru, label: Section title (RU), widget: string, required: false }
          - name: items
            label: Questions
            label_singular: Question
            widget: list
            summary: '{{fields.question_en}}'
            fields:
              - { name: question_en, label: Question (EN), widget: string }
              - { name: question_sr, label: Question (SR), widget: string, required: false }
              - { name: question_ru, label: Question (RU), widget: string, required: false }
              - name: answer_en
                label: Answer (EN)
                widget: markdown
                modes: [rich_text]
                buttons: [bold, italic, link, bulleted-list, numbered-list]
                editor_components: []
              - name: answer_sr
                label: Answer (SR)
                widget: markdown
                required: false
                modes: [rich_text]
                buttons: [bold, italic, link, bulleted-list, numbered-list]
                editor_components: []
              - name: answer_ru
                label: Answer (RU)
                widget: markdown
                required: false
                modes: [rich_text]
                buttons: [bold, italic, link, bulleted-list, numbered-list]
                editor_components: []

  - name: contact_form
    label: 'Contact form'
    description: 'The inquiry form: its questions, buttons and messages.'
    files:
      - name: contact_form
        label: 'Contact form'
        file: content/contact/contact.md
        fields:
          - { name: name_label_en, label: Name field label (EN), widget: string }
          - { name: name_label_sr, label: Name field label (SR), widget: string, required: false }
          - { name: name_label_ru, label: Name field label (RU), widget: string, required: false }
          - { name: email_label_en, label: Email field label (EN), widget: string }
          - { name: email_label_sr, label: Email field label (SR), widget: string, required: false }
          - { name: email_label_ru, label: Email field label (RU), widget: string, required: false }
          - { name: submit_en, label: Send button (EN), widget: string }
          - { name: submit_sr, label: Send button (SR), widget: string, required: false }
          - { name: submit_ru, label: Send button (RU), widget: string, required: false }
          - { name: sending_en, label: Send button while sending (EN), widget: string }
          - { name: sending_sr, label: Send button while sending (SR), widget: string, required: false }
          - { name: sending_ru, label: Send button while sending (RU), widget: string, required: false }
          - { name: success_en, label: Message after sending (EN), widget: text }
          - { name: success_sr, label: Message after sending (SR), widget: text, required: false }
          - { name: success_ru, label: Message after sending (RU), widget: text, required: false }
          - { name: error_en, label: Message if sending fails (EN), widget: text, hint: 'Shown for unexpected problems. Specific cases (too many attempts, slow connection) have their own built-in messages.' }
          - { name: error_sr, label: Message if sending fails (SR), widget: text, required: false }
          - { name: error_ru, label: Message if sending fails (RU), widget: text, required: false }
          - { label: 'Consent text (EN)', name: consent_text_en, widget: string }
          - { label: 'Consent text (SR)', name: consent_text_sr, widget: string, required: false }
          - { label: 'Consent text (RU)', name: consent_text_ru, widget: string, required: false }
          - { label: 'Consent link text (EN)', name: consent_link_en, widget: string }
          - { label: 'Consent link text (SR)', name: consent_link_sr, widget: string, required: false }
          - { label: 'Consent link text (RU)', name: consent_link_ru, widget: string, required: false }
          - name: questions
            label: Questions
            label_singular: Question
            widget: list
            summary: '{{fields.label_en}}'
            fields:
              - name: key
                label: Internal name
                widget: string
                hint: Short code, letters only, no spaces, for example placement. Used by the Show only if rules.
              - name: type
                label: Type
                widget: select
                default: text
                options:
                  - { label: Short answer, value: text }
                  - { label: Long answer, value: textarea }
                  - { label: Phone number, value: tel }
                  - { label: Dropdown, value: select }
                  - { label: Single choice, value: radio }
                  - { label: Multiple choice, value: checkboxes }
              - { name: label_en, label: Question (EN), widget: string }
              - { name: label_sr, label: Question (SR), widget: string, required: false }
              - { name: label_ru, label: Question (RU), widget: string, required: false }
              - { name: placeholder_en, label: Hint text inside the field (EN), widget: string, required: false }
              - { name: placeholder_sr, label: Hint text inside the field (SR), widget: string, required: false }
              - { name: placeholder_ru, label: Hint text inside the field (RU), widget: string, required: false }
              - { name: required, label: Required, widget: boolean, default: false }
              - name: options
                label: Options
                label_singular: Option
                widget: list
                required: false
                hint: Only for Dropdown, Single choice and Multiple choice.
                summary: '{{fields.label_en}}'
                fields:
                  - name: value
                    label: Internal name
                    widget: string
                    hint: Short code, letters only, for example arm.
                  - { name: label_en, label: Option (EN), widget: string }
                  - { name: label_sr, label: Option (SR), widget: string, required: false }
                  - { name: label_ru, label: Option (RU), widget: string, required: false }
              - name: show_if_field
                label: Show only if this question
                widget: string
                required: false
                hint: Internal name of another question. Leave empty to always show.
              - name: show_if_value
                label: Has this answer
                widget: string
                required: false
                hint: Internal name of the option, for example whatsapp.

  - name: footer
    label: 'Footer'
    description: 'Bottom of every page: tagline, cities and social links.'
    files:
      - name: footer
        label: 'Footer'
        file: content/footer/footer.md
        fields:
          - { name: tagline_en, label: Tagline (EN), widget: string }
          - { name: tagline_sr, label: Tagline (SR), widget: string, required: false }
          - { name: tagline_ru, label: Tagline (RU), widget: string, required: false }
          - { name: location_en, label: Locations (EN), widget: string }
          - { name: location_sr, label: Locations (SR), widget: string, required: false }
          - { name: location_ru, label: Locations (RU), widget: string, required: false }
          - { name: copyright_name, label: Name in copyright line, widget: string, default: Tais Tattoos }
          - name: socials
            label: Social links
            label_singular: Social link
            widget: list
            summary: '{{fields.label}}'
            fields:
              - { name: platform, label: Platform, widget: select, options: [instagram, threads, telegram, whatsapp, email, inkppl] }
              - { name: label, label: Text shown, widget: string }
              - { name: url, label: Link, widget: string, hint: 'For email use mailto:name@example.com, for WhatsApp use https://wa.me/381...' }

  - name: products
    label: 'Shop products'
    label_singular: Product
    description: 'Items for sale. The shop itself is switched on in Settings.'
    folder: content/products
    create: true
    extension: md
    format: frontmatter
    slug: '{{name_en}}'
    identifier_field: name_en
    summary: '{{name_en}} - {{price_rsd}} RSD'
    fields:
      - { label: 'Name (EN)', name: name_en, widget: string }
      - { label: 'Name (SR)', name: name_sr, widget: string, required: false }
      - { label: 'Name (RU)', name: name_ru, widget: string, required: false }
      - { label: 'Description (EN)', name: description_en, widget: text, required: false }
      - { label: 'Description (SR)', name: description_sr, widget: text, required: false }
      - { label: 'Description (RU)', name: description_ru, widget: text, required: false }
      - { label: 'Image', name: image, widget: image }
      - { label: 'Image description (EN)', name: image_alt_en, widget: string, required: false }
      - { label: 'Image description (SR)', name: image_alt_sr, widget: string, required: false }
      - { label: 'Image description (RU)', name: image_alt_ru, widget: string, required: false }
      - { label: 'Price (RSD)', name: price_rsd, widget: number, value_type: int, min: 0 }
      - { label: 'Price (EUR)', name: price_eur, widget: number, value_type: float, min: 0 }
      - { label: 'Available', name: available, widget: boolean, default: true }
      - { label: 'Order', name: order, widget: number, value_type: int, default: 1 }

  - name: shop
    label: 'Shop texts'
    description: 'Texts for the Shop page and its order form.'
    files:
      - name: shop_page
        label: Shop page
        file: content/shop/shop.md
        fields:
          - { label: 'Page title (EN)', name: page_title_en, widget: string }
          - { label: 'Page title (SR)', name: page_title_sr, widget: string, required: false }
          - { label: 'Page title (RU)', name: page_title_ru, widget: string, required: false }
          - { label: 'Intro (EN)', name: page_intro_en, widget: text, required: false }
          - { label: 'Intro (SR)', name: page_intro_sr, widget: text, required: false }
          - { label: 'Intro (RU)', name: page_intro_ru, widget: text, required: false }
          - { label: 'Sold out label (EN)', name: sold_out_en, widget: string }
          - { label: 'Sold out label (SR)', name: sold_out_sr, widget: string, required: false }
          - { label: 'Sold out label (RU)', name: sold_out_ru, widget: string, required: false }
          - { label: 'Empty shop text (EN)', name: empty_en, widget: string }
          - { label: 'Empty shop text (SR)', name: empty_sr, widget: string, required: false }
          - { label: 'Empty shop text (RU)', name: empty_ru, widget: string, required: false }
      - name: shop_order
        label: Order form
        file: content/shop/order.md
        fields:
          - { label: 'Heading (EN)', name: order_heading_en, widget: string }
          - { label: 'Heading (SR)', name: order_heading_sr, widget: string, required: false }
          - { label: 'Heading (RU)', name: order_heading_ru, widget: string, required: false }
          - { label: 'Quantity (EN)', name: quantity_en, widget: string }
          - { label: 'Quantity (SR)', name: quantity_sr, widget: string, required: false }
          - { label: 'Quantity (RU)', name: quantity_ru, widget: string, required: false }
          - { label: 'Total (EN)', name: total_en, widget: string }
          - { label: 'Total (SR)', name: total_sr, widget: string, required: false }
          - { label: 'Total (RU)', name: total_ru, widget: string, required: false }
          - { label: 'Full name (EN)', name: name_en, widget: string }
          - { label: 'Full name (SR)', name: name_sr, widget: string, required: false }
          - { label: 'Full name (RU)', name: name_ru, widget: string, required: false }
          - { label: 'Phone (EN)', name: phone_en, widget: string }
          - { label: 'Phone (SR)', name: phone_sr, widget: string, required: false }
          - { label: 'Phone (RU)', name: phone_ru, widget: string, required: false }
          - { label: 'Email (EN)', name: email_en, widget: string }
          - { label: 'Email (SR)', name: email_sr, widget: string, required: false }
          - { label: 'Email (RU)', name: email_ru, widget: string, required: false }
          - { label: 'Street and number (EN)', name: street_en, widget: string }
          - { label: 'Street and number (SR)', name: street_sr, widget: string, required: false }
          - { label: 'Street and number (RU)', name: street_ru, widget: string, required: false }
          - { label: 'City (EN)', name: city_en, widget: string }
          - { label: 'City (SR)', name: city_sr, widget: string, required: false }
          - { label: 'City (RU)', name: city_ru, widget: string, required: false }
          - { label: 'Postal code (EN)', name: postal_en, widget: string }
          - { label: 'Postal code (SR)', name: postal_sr, widget: string, required: false }
          - { label: 'Postal code (RU)', name: postal_ru, widget: string, required: false }
          - { label: 'Note (EN)', name: note_en, widget: string }
          - { label: 'Note (SR)', name: note_sr, widget: string, required: false }
          - { label: 'Note (RU)', name: note_ru, widget: string, required: false }
          - { label: 'Delivery info (EN)', name: delivery_note_en, widget: text }
          - { label: 'Delivery info (SR)', name: delivery_note_sr, widget: text, required: false }
          - { label: 'Delivery info (RU)', name: delivery_note_ru, widget: text, required: false }
          - { label: 'Nothing chosen message (EN)', name: empty_cart_en, widget: string }
          - { label: 'Nothing chosen message (SR)', name: empty_cart_sr, widget: string, required: false }
          - { label: 'Nothing chosen message (RU)', name: empty_cart_ru, widget: string, required: false }
