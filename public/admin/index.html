<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
    <title>Content Manager</title>
    <script>
      window.CMS_MANUAL_INIT = true;

      // Netlify also serves each deploy on its own address (<deploy-id>--<site>.netlify.app).
      // The GitHub login only works on the main address, so jump there.
      (function () {
        var host = window.location.hostname;
        if (host.endsWith('.netlify.app') && host.indexOf('--') !== -1) {
          window.location.replace('https://' + host.split('--').pop() + window.location.pathname);
        }
      })();
    </script>
  </head>
  <body>
    <script
      src="https://unpkg.com/decap-cms@3.17.3/dist/decap-cms.js"
      integrity="sha384-RWRzuHfiZSWCt3nEvG7B0v3cMgM1C2UuJmgBSL92GQh4uXmNSkbcthql/mNBqvjr"
      crossorigin="anonymous"
    ></script>
    <script>
      // The GitHub repository the CMS edits (owned by Tais).
      const REPO = 'taistattoos/tattoo-website';

      // Warn before saving Site settings with the shop switched on but seller details missing.
      // (The website also keeps the shop hidden on the live site in that case.)
      window.CMS.registerEventListener({
        name: 'preSave',
        handler: ({ entry }) => {
          if (entry.get('collection') !== 'settings' || entry.get('slug') !== 'site') return;

          const data = entry.get('data');
          const sellerFields = ['seller_name', 'seller_address', 'seller_mb', 'seller_pib'];
          const missingSeller = sellerFields.some((field) => !String(data.get(field) || '').trim());

          if (data.get('shop_enabled') && missingSeller) {
            const proceed = window.confirm(
              'Shop is switched ON, but the seller details are not filled in.\n\n' +
                'Selling online in Serbia requires a registered business (name, address, MB and PIB). ' +
                'Until those are filled in, the shop stays hidden on the live website.\n\n' +
                'Save anyway?',
            );
            if (!proceed) throw new Error('Saving cancelled: fill in the seller details or switch the shop off.');
          }
        },
      });

      window.initCMS({
        config: {
          backend: {
            name: 'github',
            repo: REPO,
            branch: 'main',
            base_url: window.location.origin,
            auth_endpoint: 'api/auth',
          },
        },
      });
    </script>
  </body>
</html>
